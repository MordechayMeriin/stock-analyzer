server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Runtime configuration must never be cached.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html (deep links like /MLTM/2025/report/...).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
