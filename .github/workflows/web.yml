name: web

on:
  push:
    paths:
      - "web/**"
      - "server/openapi.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "server/openapi.json"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Generated API types match server/openapi.json
        run: npm run check:api
