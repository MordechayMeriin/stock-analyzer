name: server

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # State-store contract tests also run on Postgres (design D10).
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests (offline + Postgres store; full-report checks skip without cached data)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -rs | tee pytest.out
          if grep -q "TEST_DATABASE_URL not set" pytest.out; then
            echo "::error::Postgres store tests were skipped"; exit 1
          fi
      - name: openapi.json is up to date
        run: uv run python scripts/export_openapi.py --check

  # The deploy image (render.yaml builds server/Dockerfile): it must build from the lock file and start.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server/Dockerfile
        run: docker build -t stock-analyzer-server server/
      - name: Container starts and answers /health
        shell: bash
        run: |
          docker run -d --name api -p 8000:8000 stock-analyzer-server
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; docker rm -f api >/dev/null; exit 0; fi
            sleep 2
          done
          echo "::error::the container did not answer /health"
          docker logs api
          exit 1
